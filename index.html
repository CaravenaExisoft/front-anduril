<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Andúril - Sidewing Ejecutivo</title>
    <link rel="icon" type="image/png" href="https://blobanduril.blob.core.windows.net/contenido-anduril/Avatar_Anduril.png?sp=r&st=2026-02-20T19:20:50Z&se=2027-07-31T03:35:50Z&sv=2024-11-04&sr=b&sig=QYBhSD6KE8B2odakHE333VQx8HStfhyIKpJf3oa0Ymk%3D">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');
        html, body, #root { height: 100dvh; margin: 0; padding: 0; overflow: hidden; background-color: #020617; font-family: 'Plus Jakarta Sans', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        @keyframes float-orb { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(20px, -20px); } }
        .animate-orb { animation: float-orb 10s infinite ease-in-out; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { Wind, Bot, Sword, Shield, User, Sparkles, ChevronRight, Cpu, Crown } = lucide;

        const App = () => {
            const [userToken, setUserToken] = useState(null);
            const [messages, setMessages] = useState([{ role: 'assistant', content: 'Saludos. Soy Andúril. Por favor vincula tu acceso rúnico para comenzar.' }]);
            const [input, setInput] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [previousResponseId, setPreviousResponseId] = useState(null);
            const messagesEndRef = useRef(null);
            const tokenClientRef = useRef(null);
            const tokenExpiresRef = useRef(null);
            const isSendingRef = useRef(false);
            // ID estable para toda la sesión del navegador: el MCP de Calendar cachea el
            // token de Google por este ID, así que tiene que ser el mismo en cada request.
            const conversationIdRef = useRef(crypto.randomUUID());

            const TOKEN_TTL_MS = 50 * 60 * 1000; // 50 minutos (margen sobre los 60 de Google)

            const CLIENT_ID = "1004150678649-idb7jd45g24hoe5h41rfugltlj9lqq12.apps.googleusercontent.com";
            const AVATAR_URL = "https://blobanduril.blob.core.windows.net/contenido-anduril/Avatar_Anduril.png?sp=r&st=2026-02-20T19:20:50Z&se=2027-07-31T03:35:50Z&sv=2024-11-04&sr=b&sig=QYBhSD6KE8B2odakHE333VQx8HStfhyIKpJf3oa0Ymk%3D";

            // URL de tu Backend en Azure
            const BACKEND_URL = "https://centralagentmessages-ckbhdqcjg3e4cdfq.canadacentral-01.azurewebsites.net/api/chat";

            const renderMessageContent = (text) => text ? text.split('\n').map((line, i) => (
                <span key={i} className="block mb-1">
                    {line.trim().startsWith('-') || line.trim().startsWith('•') ? 
                        <span className="flex gap-2"><span className="text-cyan-400 font-bold">•</span><span>{line.replace(/^[-•]/, '').trim()}</span></span> : line}
                </span>
            )) : null;

            const handleLogin = () => {
                const client = google.accounts.oauth2.initTokenClient({
                    client_id: CLIENT_ID,
                    scope: 'https://www.googleapis.com/auth/calendar https://www.googleapis.com/auth/userinfo.email',
                    callback: (response) => {
                        console.log('[AUTH] Respuesta OAuth completa:', response);
                        console.log('[AUTH] access_token:', response.access_token ? response.access_token.substring(0, 40) + '...' : 'AUSENTE');
                        console.log('[AUTH] token_type:', response.token_type);
                        console.log('[AUTH] expires_in:', response.expires_in);
                        console.log('[AUTH] error:', response.error ?? 'ninguno');
                        if (response.access_token) {
                            const isRenewal = !!userToken || tokenExpiresRef.current !== null;
                            setUserToken(response.access_token);
                            tokenExpiresRef.current = Date.now() + TOKEN_TTL_MS;
                            console.log('[AUTH] Token guardado en estado. isRenewal:', isRenewal, '| Expira:', new Date(tokenExpiresRef.current).toLocaleTimeString());
                            // Reiniciar la cadena de conversación para que Azure abra
                            // una nueva sesión MCP con el token fresco
                            setPreviousResponseId(null);
                            const msg = isRenewal
                                ? 'Acceso renovado. Nueva sesión iniciada con las credenciales actualizadas. ¿Cómo te puedo ayudar?'
                                : 'Protocolo validado. Acceso rúnico guardado. ¿En qué misiones puedo asistirte hoy?';
                            setMessages(prev => [...prev, { role: 'assistant', content: msg }]);
                        }
                    },
                });
                tokenClientRef.current = client;
                client.requestAccessToken();
            };

            const isTokenValid = () => {
                return userToken && tokenExpiresRef.current && Date.now() < tokenExpiresRef.current;
            };

            const handleSendMessage = async (e) => {
                e.preventDefault();
                if (!input.trim() || isLoading || isSendingRef.current) return;
                // Lock síncrono: isLoading (estado de React) no se refleja en el DOM/closure
                // hasta el próximo render, así que un segundo submit disparado en el mismo
                // instante (doble click, Enter + click) podría pasar el guard de arriba.
                // isSendingRef sí es síncrono y evita ese envío duplicado del mismo mensaje.
                isSendingRef.current = true;

                const userMsg = input.trim();
                setInput('');
                
                // 1. Actualizamos UI local
                const newHistory = [...messages, { role: 'user', content: userMsg }];
                setMessages(newHistory);
                setIsLoading(true);

                try {
                    // 2. Verificar si el token de Google sigue vigente
                    if (!isTokenValid()) {
                        setUserToken(null);
                        tokenExpiresRef.current = null;
                        // Guardar el mensaje del usuario para reenviarlo tras renovar
                        setMessages(prev => [...prev, { role: 'assistant', content: '⚠️ Tu acceso rúnico expiró. Presioná el botón para renovarlo y luego enviá tu mensaje de nuevo.' }]);
                        setIsLoading(false);
                        return;
                    }

                    // 3. Mapeo PascalCase para compatibilidad con las clases C# (ApiMessage)
                    const payloadMessages = newHistory
                        .filter(m => m.content !== 'Saludos. Soy Andúril. Por favor vincula tu acceso rúnico para comenzar.')
                        .map(m => ({ 
                            Role: m.role, 
                            Content: m.content 
                        }));

                    // 4. Petición a la Central .NET
                    console.log('[FETCH] GoogleToken presente:', !!userToken, '| PreviousResponseId:', previousResponseId ?? 'ninguno');
                    console.log('[FETCH] Token (primeros 40 chars):', userToken ? userToken.substring(0, 40) + '...' : 'NULL');
                    const res = await fetch(BACKEND_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            Messages: payloadMessages,
                            AgentName: "ITSM-Agent",
                            AgentVersion: "48",
                            GoogleToken: userToken,
                            PreviousResponseId: previousResponseId,
                            ConversationId: conversationIdRef.current
                        })
                    });

                    if (!res.ok) {
                        const errorText = await res.text();
                        console.error("Respuesta de error de la API:", errorText);
                        throw new Error(`Error del servidor: ${res.status}`);
                    }
                    
                    const data = await res.json();

                    // Encadenar conversación: guardar el responseId para el próximo mensaje
                    if (data.responseId) setPreviousResponseId(data.responseId);

                    // 4. Mostramos la respuesta del Agente
                    const botReply = data.reply || "Protocolo ejecutado, pero no se recibió respuesta de texto.";
                    setMessages(prev => [...prev, { role: 'assistant', content: botReply }]);

                } catch (e) { 
                    console.error("Error en el enlace:", e);
                    setMessages(prev => [...prev, { role: 'assistant', content: '⚠️ Error de comunicación con la Central de Mensajes. Verifica el estado del servicio.' }]);
                } finally {
                    setIsLoading(false);
                    isSendingRef.current = false;
                }
            };

            useEffect(() => {
                messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
                if (window.lucide) lucide.createIcons();
            }, [messages, isLoading]);

            return (
                <div className="flex h-full w-full bg-[#020617] text-slate-200 overflow-hidden p-2 lg:p-4 gap-4">
                    {/* Sidebar */}
                    <aside className="w-20 lg:w-72 hidden md:flex flex-col bg-white/5 border border-white/10 backdrop-blur-2xl rounded-[2rem] p-6 shadow-2xl">
                        <div className="flex items-center gap-4 mb-10">
                            <div className="w-12 h-12 rounded-2xl overflow-hidden border border-cyan-400/30">
                                <img src={AVATAR_URL} className="w-full h-full object-cover object-top scale-125" alt="Bot Avatar" />
                            </div>
                            <div className="hidden lg:block">
                                <h1 className="font-bold text-white leading-none">Andúril</h1>
                                <p className="text-[10px] text-cyan-400 uppercase font-bold">Sidewing</p>
                            </div>
                        </div>
                        <nav className="space-y-2 flex-1">
                            <div onClick={handleLogin} className="w-full flex items-center gap-4 p-4 rounded-2xl text-slate-400 hover:bg-white/5 transition-all cursor-pointer">
                                <div className="relative">
                                    <i data-lucide="Bot" className="w-5 h-5"></i>
                                    <span className={`absolute -top-1 -right-1 w-2 h-2 rounded-full ${isTokenValid() ? 'bg-green-400' : 'bg-red-500'}`}></span>
                                </div>
                                <span className="hidden lg:block text-sm">Enlace</span>
                            </div>
                            {[{i:'Sword', l:'Tareas'}, {i:'Shield', l:'Bóveda'}].map((item, idx) => (
                                <div key={idx} className="w-full flex items-center gap-4 p-4 rounded-2xl text-slate-400 hover:bg-white/5 transition-all cursor-pointer">
                                    <i data-lucide={item.i} className="w-5 h-5"></i>
                                    <span className="hidden lg:block text-sm">{item.l}</span>
                                </div>
                            ))}
                        </nav>
                    </aside>

                    {/* Chat Area */}
                    <main className="flex-1 flex flex-col min-w-0 h-full overflow-hidden">
                        <header className="h-16 flex-shrink-0 flex items-center justify-between px-8 bg-white/5 border border-white/10 backdrop-blur-xl rounded-3xl mb-4 shadow-lg">
                            <div className="flex items-center gap-3">
                                <div className="p-2 bg-blue-600/20 rounded-lg text-cyan-400">
                                    <i data-lucide="Wind" className="w-4 h-4"></i>
                                </div>
                                <h2 className="text-xs font-bold text-white uppercase tracking-widest">Protocolo Sidewing v3.0</h2>
                            </div>
                        </header>

                        <div className="flex-1 overflow-y-auto px-2 space-y-4 custom-scrollbar">
                            {messages.map((msg, idx) => (
                                <div key={idx} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'} animate-in fade-in slide-in-from-bottom-2`}>
                                    <div className={`flex gap-3 max-w-[95%] lg:max-w-[80%] ${msg.role === 'user' ? 'flex-row-reverse' : 'flex-row'}`}>
                                        <div className="w-10 h-10 rounded-xl flex-shrink-0 border border-white/10 overflow-hidden bg-slate-800 shadow-inner">
                                            {msg.role === 'user' ? 
                                                <div className="w-full h-full flex items-center justify-center"><i data-lucide="User" className="w-5 h-5 text-slate-400"></i></div> : 
                                                <img src={AVATAR_URL} className="w-full h-full object-cover object-top scale-125" />
                                            }
                                        </div>
                                        <div className={`p-4 rounded-3xl text-sm leading-relaxed shadow-xl ${msg.role === 'user' ? 'bg-blue-600 text-white' : 'bg-white/10 text-slate-100'}`}>
                                            {renderMessageContent(msg.content)}
                                        </div>
                                    </div>
                                </div>
                            ))}
                            {isLoading && (
                                <div className="flex items-center gap-2 px-14 text-cyan-400">
                                    <i data-lucide="Cpu" className="w-4 h-4 animate-spin"></i>
                                    <span className="text-[10px] font-bold uppercase tracking-wider">Conectando con el núcleo...</span>
                                </div>
                            )}
                            <div ref={messagesEndRef} />
                        </div>

                        {/* Input Area */}
                        <div className="h-24 flex-shrink-0 flex items-center px-2 mt-2">
                            {!userToken ? (
                                <button onClick={handleLogin} className="w-full p-5 bg-gradient-to-r from-blue-600 to-cyan-500 text-white font-bold rounded-3xl shadow-2xl flex items-center justify-center gap-3 transition-transform active:scale-95 hover:brightness-110">
                                    <i data-lucide="Crown" className="w-5 h-5"></i> VINCULAR ACCESO RÚNICO
                                </button>
                            ) : (
                                <form onSubmit={handleSendMessage} className="w-full flex items-center bg-white/5 border border-white/20 backdrop-blur-3xl rounded-3xl p-2 pl-6 gap-3 shadow-xl focus-within:border-cyan-400/50 transition-colors">
                                    <input 
                                        type="text" 
                                        value={input} 
                                        onChange={e => setInput(e.target.value)} 
                                        placeholder="Escribe un comando ejecutivo..." 
                                        className="flex-1 bg-transparent border-none text-white text-sm py-3 outline-none focus:ring-0" 
                                    />
                                    <button 
                                        type="submit" 
                                        disabled={isLoading}
                                        className="bg-white text-blue-900 h-12 w-12 rounded-2xl flex items-center justify-center shadow-lg active:scale-95 transition-all hover:bg-cyan-50 disabled:opacity-50"
                                    >
                                        <i data-lucide="ChevronRight" className="w-6 h-6"></i>
                                    </button>
                                </form>
                            )}
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
